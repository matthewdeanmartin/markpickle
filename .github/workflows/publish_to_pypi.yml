# .github/workflows/publish_to_pypi.yml

name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv and pipx
        run: |
          pip install uv && pip install pipx && pipx install uv

      - name: Install global dependencies
        run: |
          pipx install uv && pipx install "coderoller" && \
          pipx install isort && pipx install black && pipx install bandit && \
          pipx install pylint && pipx install poetry && pipx install hatch

      - name: Install Dependencies
        run: uv sync --all-extras

#      - name: Run just check
#        run: chmod +x scripts/*.sh && uv run make check

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run make publish
        run: uv run make publish

      - name: Validate wheel contents
        run: |
          pip install check-wheel-contents
          check-wheel-contents dist/*.whl

      - name: Verify wheel is non-empty
        run: |
          python - <<'EOF'
          import zipfile, glob, sys
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              print("ERROR: No wheel found in dist/")
              sys.exit(1)
          for whl in wheels:
              with zipfile.ZipFile(whl) as z:
                  py_files = [f for f in z.namelist() if f.endswith('.py') and 'dist-info' not in f]
                  print(f"{whl}: {len(py_files)} .py files")
                  if len(py_files) < 5:
                      print(f"ERROR: Only {len(py_files)} .py files in wheel — may be empty or broken!")
                      sys.exit(1)
          print("OK: Wheel contents look valid")
          EOF

      - name: Upload Package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/
          if-no-files-found: error
          retention-days: 1

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/markpickle
    permissions:
      id-token: write
    needs: build
    steps:
      - name: Fail if branch is not main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "This workflow should not be triggered with workflow_dispatch on a branch other than main"
          exit 1
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false



      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist/

      - name: Smoke test installed package
        run: |
          pip install dist/*.whl
          python -c "import markpickle; print(markpickle.__version__)"
          python -c "import markpickle; assert hasattr(markpickle, 'dumps'), 'missing dumps'"
          python -c "import markpickle; assert hasattr(markpickle, 'loads'), 'missing loads'"

      # Fail before uploading: the publish action's bundled twine rejects
      # metadata it cannot parse (e.g. Metadata-Version 2.5 from hatchling),
      # which otherwise only surfaces after the release is already tagged.
      - name: Validate distribution metadata
        run: uv run --with 'twine>=7' twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
